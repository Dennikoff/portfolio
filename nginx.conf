server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Hashed build assets (Astro _astro/*) — immutable, cache 1 year ---
    # ^~ обязателен: без него regex-локация ниже выигрывает у этого префикса
    # (regex приоритетнее обычного prefix), и хэшированные шрифты с картинками
    # получали бы 30d вместо immutable. ^~ останавливает подбор regex.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Остатки public/ (favicon и т.п.) — БЕЗ contenthash в имени ---
    # Здесь длинный кэш опасен: имя постоянное, значит подменённый файл иначе
    # висел бы у посетителя до истечения срока. Час + revalidate: по ETag
    # прилетает дешёвый 304, если файл не менялся.
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # --- HTML pages (Astro directory output: /page/ -> /page/index.html) ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
